version: "3.9"

# One-command deploy: docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: garuda-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-garuda-root-pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-garuda_studyhub}
      MYSQL_USER: ${MYSQL_USER:-garuda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-garuda-pass}
    ports:
      - "3306:3306"
    volumes:
      - garuda-mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: garuda-api
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_CLIENT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-garuda_studyhub}
      DB_USER: ${MYSQL_USER:-garuda}
      DB_PASSWORD: ${MYSQL_PASSWORD:-garuda-pass}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-9f8e7d6c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-1a2b3c4d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - garuda-data:/app/data
      - garuda-uploads:/app/uploads
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: garuda-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  garuda-mysql-data:
  garuda-data:
  garuda-uploads:
